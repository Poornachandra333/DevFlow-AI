spring:
  data:
    redis:
      url: ${DEVFLOW_REDIS_URL:redis://localhost:6379}
      connect-timeout: ${DEVFLOW_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${DEVFLOW_REDIS_TIMEOUT:1s}

devflow:
  rate-limit:
    submissions-per-window: ${DEVFLOW_RATE_LIMIT_SUBMISSIONS:60}
    window-seconds: ${DEVFLOW_RATE_LIMIT_WINDOW_SECONDS:60}

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,redis
